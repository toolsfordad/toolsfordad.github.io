<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy Tools by James</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #000;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .tool-list {
            list-style: none;
            padding: 0;
            margin: 0;
            /* Flexbox ensures future tools are spaced out evenly */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tool-link {
            /* Styles the anchor link to look exactly like your button */
            display: inline-block;
            border: 1px solid #000;
            background-color: #eee;
            color: #000;
            padding: 10px 15px;
            font-size: 16px;
            text-decoration: none;
            /* Removes the default link underline */
            cursor: pointer;
            text-align: center;
        }

        .tool-link:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Handy Tools by James</h1>
        </header>

        <main>
            <ul class="tool-list">
                <li>
                    <a href="calculator.html" class="tool-link">Working Days Calculator</a>
                </li>
                <!-- Future tools can just be pasted below -->
                <!-- 
                <li>
                    <a href="next-tool.html" class="tool-link">Next Awesome Tool</a>
                </li> 
                -->
            </ul>
        </main>
    </div>
</body>

</html>
