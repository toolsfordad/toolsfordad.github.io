<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Working Days</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid #000;
            padding: 20px;
        }
        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .left-panel {
            flex: 1;
            min-width: 250px;
        }
        .right-panel {
            flex: 2;
            border: 1px solid #000;
            padding: 20px;
            min-height: 200px;
        }
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
        }
        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .form-group, main > div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #000;
            box-sizing: border-box;
        }
        button#calc-btn {
            border: 1px solid #000;
            background-color: #eee;
            color: #000;
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button#calc-btn:hover {
            background-color: #ddd;
        }
        #results-section h2, #results-section h3 {
            margin-top: 0;
        }
        #results-section ul {
            padding-left: 20px;
        }
    </style>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Working Days</h1>
            <button onclick="window.location.href='index.html'" style="width: auto; margin-top: 0;">Home</button>
        </header>

        <div class="layout">
            <main class="left-panel">
                <div>
                    <label for="country">Country:</label>
                <select id="country">
                    <option value="UK">UK</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Germany">Germany</option>
                    <option value="Italy">Italy</option>
                    <option value="Spain">Spain</option>
                    <option value="France">France</option>
                    <option value="Poland">Poland</option>
                    <option value="South Africa">South Africa</option>
                    <option value="Turkey">Turkey</option>
                    <option value="Dubai (UAE)">Dubai (UAE)</option>
                    <option value="Abu Dhabi (UAE)">Abu Dhabi (UAE)</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="Qatar">Qatar</option>
                </select>
            </div>
            <br>
            <div>
                <label for="month">Month:</label>
                <select id="month">
                    <option value="All Year">All Year</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>
            <br>
            <div>
                <label for="year">Year:</label>
                <input type="number" id="year" min="2000" max="2100" value="2026">
            </div>
            <br>
            <button id="calc-btn" py-click="calculate">Calculate</button>
            </main>
            
            <section id="results-section" class="right-panel">
            </section>
        </div>
    </div>

    <py-config>
        packages = ["holidays"]
    </py-config>
    <script type="py" src="./workingdayfinder.py"></script>
</body>
</html>
